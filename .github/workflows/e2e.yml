name: End-to-end

# Real server + built web app in Chromium (login, two browsers live, restart) and the MCP integration test.
# Heavier than CI → on demand, weekly and for release tags.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
            e2e/package-lock.json
            mcp/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund --prefix web
          npm ci --no-audit --no-fund --prefix server
          npm ci --no-audit --no-fund --prefix e2e
          npm ci --no-audit --no-fund --prefix mcp
      - run: npm run build
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - name: MCP integration test
        run: |
          npm run build
          npx vitest run test/integration.test.ts
        working-directory: mcp
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: |
            e2e/test-results
            mcp/test-results
          retention-days: 7
