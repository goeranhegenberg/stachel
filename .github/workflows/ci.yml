name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tree:
    name: Public tree (independent project, no operator references)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: tools/release/check-public-tree.sh

  server:
    name: Server (typecheck, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      # server tests run parts of the shared web code (web/src) → install web dependencies as well
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm test
        working-directory: server

  web:
    name: Web (build, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web

  mcp:
    name: MCP server (build, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: mcp
      - run: npm run build
        working-directory: mcp
      # the integration test needs the real server build (e2e workflow)
      - run: npx vitest run --exclude test/integration.test.ts
        working-directory: mcp
