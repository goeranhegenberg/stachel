name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems please not here** – see SECURITY.md.
        Deutsch ist auch willkommen.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a board
        2. …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Web app (desktop browser)
        - Web app (phone / tablet browser)
        - Android app
        - Server / Docker
        - MCP / AI access
  - type: input
    id: version
    attributes:
      label: Version
      description: Docker image tag or commit, browser and OS
      placeholder: ghcr.io/goeranhegenberg/stachel:1.0.0, Firefox 140, Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Server log (`docker logs stachel`), browser console, screenshots. Remove personal data first.
