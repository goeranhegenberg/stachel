name: stachel_board_example
description: >-
  Debug screen and performance spike of the native Stachel board (2 000 / 5 000 objects), without a host app
  and without server. Run: `flutter run --profile` (phone) or `-d windows`; benchmark: see integration_test/.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  stachel_board:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
