name: stachel
description: "Stachel – das gemeinsame Whiteboard (native App, docs/stachel_app_konzept.md)."
publish_to: 'none'

version: 1.3.1+6

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  stachel_board:
    path: ../packages/stachel_board
  stachel_client:
    path: ../packages/stachel_client
  http: ^1.2.0
  shared_preferences: ^2.3.0
  crypto: ^3.0.3
  url_launcher: 6.3.3
  app_links: 7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    # license of Barlow / Barlow Condensed for the license page (main.dart registerAppLicenses)
    - assets/fonts/OFL-Barlow.txt

  # Barlow / Barlow Condensed wie das Web (SIL OFL); die Board-Tests des Pakets stachel_board laden sie auch von hier.
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-Black.ttf
          weight: 900
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
