name: stachel
description: "Stachel – das gemeinsame Whiteboard."
publish_to: 'none'

version: 1.4.0+7

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  stachel_board:
    path: ../packages/stachel_board
  stachel_client:
    path: ../packages/stachel_client
  http: ^1.2.0
  shared_preferences: ^2.3.0
  crypto: ^3.0.3
  url_launcher: 6.3.3
  app_links: 7.2.2
  desktop_drop: 0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: 3.18.0
  image: 4.8.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    # license of Barlow / Barlow Condensed for the license page (main.dart registerAppLicenses)
    - assets/fonts/OFL-Barlow.txt

  # Barlow / Barlow Condensed wie das Web (SIL OFL); die Board-Tests des Pakets stachel_board laden sie auch von hier.
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-Black.ttf
          weight: 900
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700

# Microsoft Store package (dart run msix:create --store; windows/installer/build.ps1 -Msix, docs/release/desktop.md).
# identity_name, publisher and publisher_display_name are placeholders: after reserving the name „Stachel“ in Partner
# Center copy the three values from Product identity (Package/Identity/Name, Package/Identity/Publisher,
# Package/Properties/PublisherDisplayName) here. Without --store the package is signed with a test certificate.
msix_config:
  display_name: Stachel
  identity_name: PLATZHALTER.Stachel
  publisher: CN=00000000-0000-0000-0000-000000000000
  publisher_display_name: PLATZHALTER
  logo_path: windows/packaging/stachel_logo.png
  languages: de-de, en-us
  capabilities: internetClient
  protocol_activation: stachel
  architecture: x64
  os_min_version: 10.0.17763.0
  build_windows: false
